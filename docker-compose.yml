# Yalnızca geliştirme ortamı. Prod topolojisi: ARCHITECTURE.md §11.
name: portfolyo-v2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolyo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolyo_db}
      TZ: Europe/Istanbul
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5447}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # web arayüzü
      - '127.0.0.1:1025:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
